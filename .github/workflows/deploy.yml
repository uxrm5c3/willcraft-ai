name: Deploy to production

# Auto-deploys WillCraft to will.alantanjb.com (AWS EC2 i-05de038faf5163f3c)
# whenever main is pushed. SSHes into the server, pulls latest, rebuilds Docker.
#
# One-time setup (Repository Settings → Secrets and variables → Actions):
#   DEPLOY_HOST    = 52.221.231.214
#   DEPLOY_USER    = ubuntu
#   DEPLOY_SSH_KEY = (paste private key — see deploy-setup.sh in repo root)
#
# Optional secrets (used by chat features; absent = that feature disabled):
#   POSTMARK_INBOUND_USER     = the username half of the webhook Basic Auth
#   POSTMARK_INBOUND_PASS     = the password half of the webhook Basic Auth
#   INBOUND_ALLOWED_DOMAINS   = comma-separated sender allowlist (default 'alantanjb.com')
#   OPENAI_API_KEY            = OpenAI API key for Whisper voice transcription
#
# Then every `git push origin main` triggers this workflow → live in ~90s.

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # also allow manual trigger from Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Sync inbound-mail env vars to server .env
        # Build the local fragment, scp it across, then a tiny ssh command
        # merges it into /home/ubuntu/willcraft-ai/.env. Anything not
        # mentioned in the fragment is left untouched. If the secrets are
        # all empty the step still runs harmlessly (writes nothing).
        env:
          PM_USER: ${{ secrets.POSTMARK_INBOUND_USER }}
          PM_PASS: ${{ secrets.POSTMARK_INBOUND_PASS }}
          ALLOWED: ${{ secrets.INBOUND_ALLOWED_DOMAINS }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -e
          : > /tmp/inbound.env
          [ -n "$PM_USER" ] && printf 'POSTMARK_INBOUND_USER=%s\n' "$PM_USER" >> /tmp/inbound.env
          [ -n "$PM_PASS" ] && printf 'POSTMARK_INBOUND_PASS=%s\n' "$PM_PASS" >> /tmp/inbound.env
          [ -n "$ALLOWED" ] && printf 'INBOUND_ALLOWED_DOMAINS=%s\n' "$ALLOWED" >> /tmp/inbound.env
          [ -n "$OPENAI_KEY" ] && printf 'OPENAI_API_KEY=%s\n' "$OPENAI_KEY" >> /tmp/inbound.env
          echo "Fragment to sync ($(wc -l < /tmp/inbound.env) lines):"
          cut -d= -f1 /tmp/inbound.env | sed 's/^/  - /'
          if [ ! -s /tmp/inbound.env ]; then
            echo "No inbound secrets set — skipping sync."; exit 0;
          fi
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no /tmp/inbound.env \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/inbound.env
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              'set -e; \
               PROJ=""; \
               for d in ~/willcraft-ai ~/will.alantanjb.com ~/will-writing-ai ~/willcraft ~/app /opt/willcraft /srv/willcraft; do \
                 if [ -f "$d/docker-compose.yml" ]; then PROJ="$d"; break; fi; \
               done; \
               if [ -z "$PROJ" ]; then \
                 PROJ=$(find ~ -maxdepth 4 -name docker-compose.yml -not -path "*/node_modules/*" 2>/dev/null | head -1); \
                 [ -n "$PROJ" ] && PROJ=$(dirname "$PROJ"); \
               fi; \
               if [ -z "$PROJ" ]; then \
                 echo "ERROR: could not locate project directory (no docker-compose.yml in usual paths)"; \
                 echo "Home contents:"; ls -la ~; \
                 exit 1; \
               fi; \
               echo "Project directory: $PROJ"; \
               F="$PROJ/.env"; \
               touch "$F"; \
               while IFS= read -r line; do \
                 [ -z "$line" ] && continue; \
                 key="${line%%=*}"; \
                 sed -i "/^${key}=/d" "$F"; \
                 printf "%s\n" "$line" >> "$F"; \
                 echo "  upserted $key"; \
               done < /tmp/inbound.env; \
               rm -f /tmp/inbound.env; \
               echo "Final .env keys: $(cut -d= -f1 "$F" | sort -u | tr "\n" " ")"'

      - name: Pull + rebuild on server (will.alantanjb.com)
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              'bash ~/deploy-alantanjb.sh'

      - name: Reload nginx (picks up nginx/default.conf changes)
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              'set -e; \
               PROJ=""; \
               for d in ~/willcraft-ai ~/will.alantanjb.com ~/will-writing-ai ~/willcraft ~/app /opt/willcraft /srv/willcraft; do \
                 if [ -f "$d/docker-compose.yml" ]; then PROJ="$d"; break; fi; \
               done; \
               if [ -z "$PROJ" ]; then \
                 PROJ=$(find ~ -maxdepth 4 -name docker-compose.yml -not -path "*/node_modules/*" 2>/dev/null | head -1); \
                 [ -n "$PROJ" ] && PROJ=$(dirname "$PROJ"); \
               fi; \
               if [ -z "$PROJ" ]; then echo "ERROR: no compose file found"; exit 1; fi; \
               echo "Restarting nginx in $PROJ"; \
               cd "$PROJ" && docker compose restart nginx 2>&1 | tail -5'

      - name: Smoke-check
        run: |
          # Wait for the container to be healthy + simple HTTP check
          sleep 10
          curl -sSf -o /dev/null -w "HTTP %{http_code}\n" https://will.alantanjb.com/login || true
